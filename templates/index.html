<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Slideshow</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
        }

        #image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            opacity: 0;
            z-index: 1;
            transition: opacity 1s ease-in-out;
            will-change: opacity;
        }

        .slide.active {
            opacity: 1;
            z-index: 10;
        }

        .slide.transitioning {
            z-index: 20;
        }

        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 999;
            display: none;
        }

        #legend-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
            z-index: 1000;
            display: none;
            max-width: 250px;
        }

        .legend-entry {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
            color: white;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 2px;
        }

        .legend-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #admin-link {
            position: absolute;
            bottom: 8px;
            right: 10px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 11px;
            text-decoration: none;
            z-index: 1000;
            font-family: monospace;
        }
        #admin-link:hover { color: rgba(255, 255, 255, 0.9); }
    </style>
</head>
<body>
    <div id="image-container">
        <div id="loading-indicator">Loading weather slideshow...</div>
        <img id="slide-1" class="slide" src="" alt="Weather Image">
        <img id="slide-2" class="slide" src="" alt="Weather Image">
    </div>

    <div id="legend-overlay"></div>
    <a id="admin-link" href="/admin">Admin &rarr; ({{ app_version }})</a>

    <script>
        let displayedImageUrl = '';
        let displayedImageIndex = -1;
        let currentCountdown = 30;
        let countdownInterval = null;
        let isInitialLoad = true;
        let isUpdating = false;
        let updateStartedAtMs = 0;
        const WEATHER_MAP_INDEX = 8;
        const RESYNC_INTERVAL_SEC = 15;
        const API_FETCH_TIMEOUT_MS = 15000;
        const IMAGE_LOAD_TIMEOUT_MS = 35000;
        const UPDATE_STALE_TIMEOUT_MS = 45000;
        let secondsUntilResync = RESYNC_INTERVAL_SEC;
        let currentSlideId = null;

        function clearStuckUpdateState(reason) {
            if (!isUpdating) return;
            console.warn('Clearing stuck update state:', reason);
            isUpdating = false;
            updateStartedAtMs = 0;
        }

        function fetchJsonWithTimeout(url, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timeoutId));
        }

        function fetchLegendData() {
            return fetch('/api/legend')
                .then(r => r.json())
                .then(d => d.legend_entries || [])
                .catch(err => { console.error('Error fetching legend:', err); return []; });
        }

        function updateLegendDisplay(imageIndex) {
            const legendOverlay = document.getElementById('legend-overlay');
            if (imageIndex === WEATHER_MAP_INDEX) {
                fetchLegendData().then(entries => {
                    if (entries.length > 0) {
                        legendOverlay.innerHTML = entries.map(e => `
                            <div class="legend-entry">
                                <div class="legend-color" style="background-color: ${e.color}"></div>
                                <div class="legend-text">${e.text}</div>
                            </div>`).join('');
                        legendOverlay.style.display = 'block';
                    } else {
                        legendOverlay.style.display = 'none';
                    }
                });
            } else {
                legendOverlay.style.display = 'none';
            }
        }

        function startCountdownTimer() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                if (currentCountdown <= 0) {
                    clearInterval(countdownInterval);
                    updateSlideshow();
                    return;
                }
                currentCountdown -= 1;
                secondsUntilResync -= 1;
                if (secondsUntilResync <= 0) {
                    secondsUntilResync = RESYNC_INTERVAL_SEC;
                    updateSlideshow();
                }
            }, 1000);
        }

        function updateSlideshow() {
            if (isUpdating && updateStartedAtMs && (Date.now() - updateStartedAtMs > UPDATE_STALE_TIMEOUT_MS)) {
                clearStuckUpdateState('update watchdog timeout');
            }
            if (isUpdating) return;
            isUpdating = true;
            updateStartedAtMs = Date.now();

            fetchJsonWithTimeout('/api/current-image', API_FETCH_TIMEOUT_MS)
                .then(r => r.json())
                .then(data => {
                    currentCountdown = data.countdown;
                    secondsUntilResync = RESYNC_INTERVAL_SEC;

                    const shouldUpdateImage = data.image_url && (data.image_url !== displayedImageUrl || data.image_index !== displayedImageIndex);
                    if (shouldUpdateImage) {
                        const nextSlideId = currentSlideId === 'slide-1' ? 'slide-2' : 'slide-1';
                        const nextSlide = document.getElementById(nextSlideId);
                        const currentSlide = currentSlideId ? document.getElementById(currentSlideId) : null;
                        displayedImageUrl = data.image_url;
                        displayedImageIndex = data.image_index;
                        updateLegendDisplay(data.image_index);
                        if (isInitialLoad) document.getElementById('loading-indicator').style.display = 'block';

                        nextSlide.onload = null;
                        nextSlide.onerror = null;
                        let imageLoadTimeoutId = null;
                        const finishImageUpdate = (didLoad, reason) => {
                            if (imageLoadTimeoutId) { clearTimeout(imageLoadTimeoutId); imageLoadTimeoutId = null; }
                            clearStuckUpdateState(reason);
                        };

                        nextSlide.onload = function() {
                            if (isInitialLoad) {
                                document.getElementById('loading-indicator').style.display = 'none';
                                isInitialLoad = false;
                            }
                            nextSlide.classList.add('transitioning');
                            requestAnimationFrame(() => nextSlide.classList.add('active'));
                            setTimeout(() => {
                                nextSlide.classList.remove('transitioning');
                                if (currentSlide) currentSlide.classList.remove('active');
                                currentSlideId = nextSlideId;
                                finishImageUpdate(true, 'image loaded');
                            }, 1000);
                        };
                        nextSlide.onerror = function() {
                            console.error('Failed to load image:', data.image_url);
                            finishImageUpdate(false, 'image load error');
                            setTimeout(updateSlideshow, 1000);
                            if (isInitialLoad) {
                                document.getElementById('loading-indicator').style.display = 'none';
                                isInitialLoad = false;
                            }
                        };
                        const cacheBustUrl = data.image_url + (data.image_url.includes('?') ? '&' : '?') + '_t=' + Date.now();
                        nextSlide.src = cacheBustUrl;
                        imageLoadTimeoutId = setTimeout(() => {
                            nextSlide.onload = null;
                            nextSlide.onerror = null;
                            finishImageUpdate(false, 'image load timeout');
                            setTimeout(updateSlideshow, 1000);
                        }, IMAGE_LOAD_TIMEOUT_MS);
                    } else {
                        clearStuckUpdateState('no image update needed');
                    }
                    startCountdownTimer();
                })
                .catch(error => {
                    console.error('Error fetching slideshow data:', error);
                    clearStuckUpdateState('api fetch error');
                    setTimeout(updateSlideshow, 5000);
                });
        }

        updateSlideshow();
    </script>
</body>
</html>
